<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Summary</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Modal overlay styles for Show Logs */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-close {
            float: right;
            cursor: pointer;
            background: #eee;
            border: 1px solid #ccc;
            padding: 4px 8px;
            border-radius: 4px;
        }
        table.week-summary {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
        }
        table.week-summary th, table.week-summary td {
            border: 1px solid #ddd;
            padding: 4px 6px;
            text-align: left;
            vertical-align: middle;
            font-size: 13px;
        }
        table.week-logs th, table.week-logs td {
            border: 1px solid #ddd;
            padding: 6px;
        }
        button.show-logs {
            padding: 3px 6px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.2;
            border-radius: 3px;
            background: #f8f8f8;
            border: 1px solid #ccc;
            color: inherit;
        }
        table.week-summary input[type="number"], table.week-summary input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 4px 6px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        /* Quarter layout: table on left, chart on right */
        .quarter-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .quarter-table { flex: 1; }
        .quarter-chart { width: 40%; min-width: 300px; }
        .per-day-good { color: #0f9d58; font-weight: 700; }
        .per-day-bad { color: #d93025; font-weight: 700; }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="editSplits.html">Edit Splits</a>
        <a href="daily.html">Daily Summaries</a>
        <a href="weekly.html" class="active">Weekly Summaries</a>
    </div>
    <script src="functions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Retrieve data from local storage
        const allTimeSplits = JSON.parse(localStorage.getItem('allTimeSplits')) || [];

        // Build week-level totals and keep logs for each week
        function generateWeeklyTotals() {
            const weeks = {}; // key: weekFinish locale string -> { weekDate, totalDuration, logs: [...] }

            allTimeSplits.forEach(split => {
                const startDate = new Date(split.startTime);
                const weekFinish = new Date(startDate.getFullYear(), startDate.getMonth(), 
                                           startDate.getDate() + 7 - getDayTreatSundayAsLast(startDate));
                // Use an ISO date key for reliable sorting, and keep a localized display date
                const weekISO = weekFinish.toISOString();
                const weekKey = weekISO.slice(0,10); // YYYY-MM-DD
                const duration = calculateTotalDuration(split.startTime, split.endTime);

                if (!weeks[weekKey]) {
                    weeks[weekKey] = { weekDate: weekFinish.toLocaleDateString(), weekISO: weekISO, totalDuration: 0, logs: [] };
                }

                weeks[weekKey].totalDuration += duration;
                weeks[weekKey].logs.push(Object.assign({}, split, { duration }));
            });

            return sortObjectByDate(weeks, 'desc');
        }

        // Helper: compute per-day hours = totalHours / (5 - weekdaysRemaining - daysOff)
        // weekdaysRemaining: number of weekdays remaining in that week (Mon-Fri) from today to week end
        function computePerDay(totalHours, daysOff, weekdaysRemaining = 0) {
            const doff = isNaN(daysOff) ? 0 : Number(daysOff);
            const workingDays = 5 - (isNaN(weekdaysRemaining) ? 0 : Number(weekdaysRemaining)) - doff;
            if (workingDays <= 0) return 0;
            const v = totalHours / workingDays;
            return isFinite(v) ? v : 0;
        }

        // Helper: number of weekdays remaining in the week for a given weekISO (YYYY-MM-DD or ISO string)
        function weekdaysRemainingInWeek(weekISO) {
            try {
                const today = new Date();
                // normalize to local date (00:00)
                const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                // start counting from tomorrow (do not count today)
                t.setDate(t.getDate() + 1);
                const weekEnd = new Date(weekISO);
                // if weekEnd is before tomorrow, remaining is 0
                if (weekEnd < t) return 0;

                let count = 0;
                const cur = new Date(t);
                while (cur <= weekEnd) {
                    const day = cur.getDay();
                    if (day >= 1 && day <= 5) count++;
                    cur.setDate(cur.getDate() + 1);
                }
                return count;
            } catch (e) {
                return 0;
            }
        }

        // Helper: format numeric display to 2 decimal places
        function formatNumber(n) {
            const num = Number(n) || 0;
            return num.toFixed(2);
        }

        // Apply styling to a per-day cell based on numeric value
        function stylePerDayCell(cell, value) {
            if (!cell) return;
            cell.classList.remove('per-day-good', 'per-day-bad');
            const v = Number(value) || 0;
            if (v >= 7) {
                cell.classList.add('per-day-good');
            } else if (v < 6) {
                cell.classList.add('per-day-bad');
            }
        }

        // Render week summary table with Show Logs buttons, grouped by calendar-year quarters
        function renderWeekSummaryTable(weeksObj) {
            const container = document.createElement('div');
            const weeklyMeta = JSON.parse(localStorage.getItem('weeklyMeta') || '{}');

            function saveWeeklyMeta() {
                localStorage.setItem('weeklyMeta', JSON.stringify(weeklyMeta));
            }

            // Group weeks into quarters (e.g., "2026 Q3")
            const quarters = {};
            Object.keys(weeksObj).forEach(key => {
                const wk = weeksObj[key];
                const iso = wk.weekISO || key; // ISO fallback to key
                const d = new Date(iso);
                const quarter = Math.floor(d.getMonth() / 3) + 1;
                const quarterKey = `${d.getFullYear()} Q${quarter}`;
                if (!quarters[quarterKey]) quarters[quarterKey] = [];
                quarters[quarterKey].push(wk);
            });

            // Sort quarter keys descending by year then quarter
            const quarterKeys = Object.keys(quarters).sort((a, b) => {
                const [ay, aq] = a.split(' Q').map(Number);
                const [by, bq] = b.split(' Q').map(Number);
                if (ay !== by) return by - ay;
                return bq - aq;
            });

            // Render each quarter section with its table and chart
            quarterKeys.forEach(qk => {
                const quarterSection = document.createElement('div');
                const heading = document.createElement('h3');
                heading.textContent = qk;
                // compute quarter average (total hours / ((weeks * 5) - sumDaysOff))
                const weeksInQuarter = quarters[qk] || [];
                const totalMsSum = weeksInQuarter.reduce((acc, w) => acc + (w.totalDuration || 0), 0);
                const totalHours = totalMsSum / 3600000;
                const sumDaysOff = weeksInQuarter.reduce((acc, w) => {
                    const meta = weeklyMeta[w.weekDate] || { daysOff: 0 };
                    return acc + (Number(meta.daysOff) || 0);
                }, 0);
                const denom = (weeksInQuarter.length * 5) - sumDaysOff;
                const quarterAvg = denom > 0 ? totalHours / denom : 0;
                const avgSpan = document.createElement('span');
                avgSpan.style.marginLeft = '10px';
                avgSpan.style.fontSize = '0.9em';
                avgSpan.style.fontWeight = 'normal';
                avgSpan.textContent = `Average: ${formatNumber(quarterAvg)} h/day`;
                heading.appendChild(avgSpan);
                quarterSection.appendChild(heading);

                const quarterRow = document.createElement('div');
                quarterRow.className = 'quarter-row';

                // table (left)
                const tableWrap = document.createElement('div');
                tableWrap.className = 'quarter-table';
                const table = document.createElement('table');
                table.className = 'week-summary';
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Week ending</th>
                            <th>Total Hours</th>
                            <th>Days Off</th>
                            <th>Per Day</th>
                            <th>Comment</th>
                            <th>Show Logs</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                const tbody = table.querySelector('tbody');

                // chart (right)
                const chartWrap = document.createElement('div');
                chartWrap.className = 'quarter-chart';
                const canvas = document.createElement('canvas');
                const safeKey = qk.replace(/[^a-zA-Z0-9_-]/g, '-');
                canvas.id = `chart-${safeKey}`;
                chartWrap.appendChild(canvas);

                // sort weeks within quarter by weekISO desc
                quarters[qk].sort((a, b) => new Date(b.weekISO) - new Date(a.weekISO));

                quarters[qk].forEach(wk => {
                    const tr = document.createElement('tr');
                    const meta = weeklyMeta[wk.weekDate] || { daysOff: 0, comment: '' };
                    const totalHoursNum = (wk.totalDuration || 0) / 3600000;
                    const weekdaysRemaining = weekdaysRemainingInWeek(wk.weekISO);
                    const perDayValue = computePerDay(totalHoursNum, meta.daysOff, weekdaysRemaining);

                    tr.innerHTML = `
                        <td>${wk.weekDate}</td>
                        <td class="total-hours">${formatNumber(totalHoursNum)}</td>
                        <td class="days-off-cell"></td>
                        <td class="per-day-cell">${formatNumber(perDayValue)}</td>
                        <td class="comment-cell"></td>
                        <td><button class="show-logs">Show Logs</button></td>
                    `;

                    // style per-day cell according to value
                    const perDayCell = tr.querySelector('.per-day-cell');
                    stylePerDayCell(perDayCell, perDayValue);

                    // Days Off input
                    const daysOffInput = document.createElement('input');
                    daysOffInput.type = 'number';
                    daysOffInput.step = '0.1';
                    daysOffInput.min = '0';
                    daysOffInput.max = '5';
                    daysOffInput.value = meta.daysOff;
                    
                    daysOffInput.addEventListener('input', (e) => {
                        const v = parseFloat(e.target.value) || 0;
                        weeklyMeta[wk.weekDate] = weeklyMeta[wk.weekDate] || { daysOff: 0, comment: '' };
                        weeklyMeta[wk.weekDate].daysOff = v;
                        saveWeeklyMeta();
                        const newPerDay = computePerDay(totalHoursNum, v, weekdaysRemaining);
                        const cell = tr.querySelector('.per-day-cell');
                        cell.textContent = formatNumber(newPerDay);
                        stylePerDayCell(cell, newPerDay);
                    });

                    tr.querySelector('.days-off-cell').appendChild(daysOffInput);

                    // Comment input
                    const commentInput = document.createElement('input');
                    commentInput.type = 'text';
                    commentInput.value = meta.comment || '';
                    
                    commentInput.addEventListener('change', (e) => {
                        weeklyMeta[wk.weekDate] = weeklyMeta[wk.weekDate] || { daysOff: 0, comment: '' };
                        weeklyMeta[wk.weekDate].comment = e.target.value;
                        saveWeeklyMeta();
                    });
                    tr.querySelector('.comment-cell').appendChild(commentInput);

                    tr.querySelector('button.show-logs').addEventListener('click', () => openLogsModal(wk));

                    tbody.appendChild(tr);
                });

                tableWrap.appendChild(table);
                quarterRow.appendChild(tableWrap);
                quarterRow.appendChild(chartWrap);
                quarterSection.appendChild(quarterRow);
                container.appendChild(quarterSection);

                // create chart for this quarter
                createQuarterChart(canvas, quarters[qk], weeklyMeta);
            });

            document.body.appendChild(container);
        }

        // Create and open modal overlay showing logs table for a week
        function openLogsModal(weekObj) {
            // create overlay
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';

            const modal = document.createElement('div');
            modal.className = 'modal-content';

            const closeBtn = document.createElement('button');
            closeBtn.className = 'modal-close';
            closeBtn.textContent = 'Close';
            closeBtn.addEventListener('click', () => document.body.removeChild(overlay));

            const title = document.createElement('h3');
            title.textContent = `Week ending ${weekObj.weekDate} — ${millisecondsToHours(weekObj.totalDuration)} hours`;

            modal.appendChild(closeBtn);
            modal.appendChild(title);

            const logsTable = createLogsTable(weekObj.logs);
            modal.appendChild(logsTable);

            overlay.appendChild(modal);
            document.body.appendChild(overlay);
        }

        // Create logs summary table grouped by customer + project
        function createLogsTable(logs) {
            const groups = {};

            logs.forEach(l => {
                const customer = l.customer || 'Unknown';
                const project = l.project || 'Unknown';
                const key = `${customer}||${project}`;
                if (!groups[key]) {
                    groups[key] = { customer, project, totalDuration: 0, descriptions: [] };
                }
                groups[key].totalDuration += l.duration || 0;
                const desc = l.description || '';
                if (desc && !groups[key].descriptions.includes(desc)) {
                    groups[key].descriptions.push(desc);
                }
            });

            const table = document.createElement('table');
            table.className = 'week-logs';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Project</th>
                        <th>Total Duration</th>
                        <th>Descriptions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;

            const tbody = table.querySelector('tbody');
            Object.keys(groups).forEach(key => {
                const g = groups[key];
                const row = document.createElement('tr');
                const descHtml = g.descriptions.length > 0 ? `<ul>${g.descriptions.map(d => `<li>${d}</li>`).join('')}</ul>` : '';
                row.innerHTML = `
                    <td>${g.customer}</td>
                    <td>${g.project}</td>
                    <td>${millisecondsToHours(g.totalDuration)}</td>
                    <td>${descHtml}</td>
                `;
                tbody.appendChild(row);
            });

            return table;
        }

        // Create a line chart for a quarter showing per-day values with horizontal y=7 line
        function createQuarterChart(canvas, weekArray, weeklyMeta) {
            if (!canvas || !window.Chart) return;
            const labels = weekArray.map(wk => wk.weekDate).reverse(); // ascending by week
            const perDayData = weekArray.map(wk => {
                const meta = weeklyMeta[wk.weekDate] || { daysOff: 0 };
                const totalHoursNum = (wk.totalDuration || 0) / 3600000;
                const weekdaysRemaining = weekdaysRemainingInWeek(wk.weekISO);
                return computePerDay(totalHoursNum, meta.daysOff, weekdaysRemaining);
            }).reverse();

            const targetLine = new Array(perDayData.length).fill(7);

            const ctx = canvas.getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Per Day',
                            data: perDayData,
                            borderColor: '#3e95cd',
                            backgroundColor: 'rgba(62,149,205,0.1)',
                            fill: false,
                            tension: 0.2,
                        },
                        {
                            label: 'Target 7h',
                            data: targetLine,
                            borderColor: '#ff4d4f',
                            borderDash: [6,4],
                            fill: false,
                            pointRadius: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: { display: true }
                    }
                }
            });
        }

        // Build and render
        const weeksObj = generateWeeklyTotals();
        renderWeekSummaryTable(weeksObj);
    </script>
</body>

</html>
