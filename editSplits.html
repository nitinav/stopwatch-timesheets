<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Table from Local Storage</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="navbar-root"></div>
    <br><br>
    <label for="date-picker">Select Day: </label>
    <input type="date" id="date-picker" />
    <table id="data-table">
        <thead>
            <tr>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Duration</th>
                <th>Customer</th>
                <th>Project</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="functions.js"></script>

    <script>
        // Empty data row
        let empty_data_row = { 'startTime': '', 'endTime': '', 'customer': '', 'project': '', 'description': '' };

        // Selected day (YYYY-MM-DD) using local timezone
        function localISOFromDate(d) {
            const date = new Date(d);
            if (isNaN(date)) return '';
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        let selectedDate = localISOFromDate(new Date());

        // Data for the selected day only
        let data = [];

        // Function to load data for a given date (YYYY-MM-DD)
        function loadDataForDate(dateISO) {
            const all = JSON.parse(localStorage.getItem('allTimeSplits')) || [];
            data = all.filter(item => {
                try {
                    return localISOFromDate(item.startTime) === dateISO;
                } catch (e) {
                    return false;
                }
            });
            renderTable();
        }

        // Initialize date picker
        const datePickerElement = document.getElementById('date-picker');
        datePickerElement.value = selectedDate;
        datePickerElement.addEventListener('change', (e) => {
            selectedDate = e.target.value;
            loadDataForDate(selectedDate);
        });

        // Function to render the table
        function renderTable() {
            const tableBody = document.querySelector('#data-table tbody');
            tableBody.innerHTML = '';

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                let duration = new Date(item.endTime) - new Date(item.startTime);
                row.innerHTML = `
                    <td contenteditable="true" onblur="renderTable()">${item.startTime}</td>
                    <td contenteditable="true" onblur="renderTable()">${item.endTime}</td>
                    <td contenteditable="false">${formatDuration(duration)}</td>
                    <td contenteditable="true">${item.customer}</td>
                    <td contenteditable="true">${item.project}</td>
                    <td contenteditable="true">${item.description}</td>
                    <td>
                        <select onchange="handleDropdown(this.value, ${index})">
                            <option value="">Select Action</option>
                            <option value="insertAbove">Insert Row Above</option>
                            <option value="insertBelow">Insert Row Below</option>
                            <option value="delete">Delete Row</option>
                        </select>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function handleDropdown(action, index) {
            switch (action) {
                case "insertAbove":
                    insertRowAbove(index);
                    break;
                case "insertBelow":
                    insertRowBelow(index);
                    break;
                case "delete":
                    deleteRow(index);
                    break;
                default:
                    // Do nothing or handle default case
                    break;
            }
        }

        // Function to add a new row above
        function insertRowAbove(index) {
            // insert a shallow copy to avoid referencing the same object
            data.splice(index, 0, Object.assign({}, empty_data_row));
            renderTable();
            saveChanges();
        }

        // Function to add a new row below
        function insertRowBelow(index) {
            data.splice(index + 1, 0, Object.assign({}, empty_data_row));
            renderTable();
            saveChanges();
        }

        // Function to delete a row
        function deleteRow(index) {
            data.splice(index, 1);
            renderTable();
            saveChanges();
        }

        // Save edited values back to local storage
        function saveChanges() {
            const tableRows = document.querySelectorAll('#data-table tbody tr');
            const editedForDay = [];

            tableRows.forEach(row => {
                const startTime = row.cells[0].textContent;
                const endTime = row.cells[1].textContent;
                const customer = row.cells[3].textContent;
                const project = row.cells[4].textContent;
                const description = row.cells[5].textContent;
                editedForDay.push({ startTime, endTime, description, customer, project });
            });

            // Merge editedForDay into allTimeSplits while preserving other days
            const all = JSON.parse(localStorage.getItem('allTimeSplits')) || [];
            const others = all.filter(item => {
                try {
                    return localISOFromDate(item.startTime) !== selectedDate;
                } catch (e) {
                    return true;
                }
            });
            const newAll = others.concat(editedForDay);
            localStorage.setItem('allTimeSplits', JSON.stringify(newAll));

            // update local `data` to reflect saved rows
            data = editedForDay;
        }

        // Event listener for table cell editing
        document.querySelector('#data-table').addEventListener('input', saveChanges);

        // Render the table initially for the selected date
        loadDataForDate(selectedDate);

        // Update per day display in navbar
        updateNavbarPerDay();
        setInterval(updateNavbarPerDay, 60000); // Update every minute
    </script>
</body>

</html>
